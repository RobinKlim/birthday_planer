isar_version: &isar_version 3.1.0 # define the version to be used

name: birthday_planer
description: safe gifts for friends and get reminded about their birthdays.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.17.0
  provider: ^6.0.0


  isar: *isar_version
  isar_flutter_libs: *isar_version # contains Isar Core
  path_provider: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

  isar_generator: *isar_version
  build_runner: any


flutter:
  uses-material-design: true